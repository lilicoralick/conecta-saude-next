<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conecta Saúde | Prazer!</title>
<meta property="og:title" content="Você acabou de conhecer alguém do Conecta Saúde">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo">
  <img class="logo" src="simbolo.png" alt="Conecta Saúde">
  <p class="ola">Você acabou de conhecer</p>
  <p class="nome-grande" id="nome"></p>
  <p class="frase">do projeto <strong>Conecta Saúde</strong>, o SUS na palma da mão com IA.</p>
</header>
<main>
  <section class="cartao">
    <p class="titulo-secao" id="convite"></p>
    <a class="botao primario" id="principal" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
      <span id="rotulo"></span>
    </a>
    <p class="aviso" id="aviso">Link ainda não configurado.</p>
    <p class="dica" id="dica"></p>
    <a class="botao secundario" href="./" style="margin-top:14px">Conhecer o projeto e a equipe</a>
  </section>
  <p class="rodape">HackGov · FIAP 2026</p>
</main>
<script src="membros.js"></script>
<script>
  const id = location.pathname.split("/").filter(Boolean).pop().replace(/\.html$/, "");
  const m = MEMBROS.find(x => x.id === id) || MEMBROS[0];
  document.title = "Conecta Saúde | " + m.primeiroNome;
  document.getElementById("nome").textContent = m.primeiroNome;
  document.getElementById("convite").textContent = "Adoraria me conectar com você";
  document.getElementById("rotulo").textContent = m.rotulo;
  const ehLinkedin = /linkedin\.com/i.test(m.link);
  document.getElementById("dica").textContent = ehLinkedin
    ? "No LinkedIn, toque em “Conectar” ou “Seguir”. Que bom te conhecer!"
    : "Que bom te conhecer!";
  const b = document.getElementById("principal");
  if (m.link && !m.link.startsWith("COLE_AQUI")) b.href = m.link;
  else { b.removeAttribute("href"); b.style.opacity = .5; document.getElementById("aviso").style.display = "block"; }
</script>
</body>
</html>
